<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setangkai Project — Sistem Manajemen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6EF;
    --surface:#FFFFFF;
    --ink:#2A2A24;
    --ink-soft:#7A7466;
    --primary:#2F4B3C;
    --primary-dark:#22392C;
    --primary-soft:#E7EDE6;
    --accent:#C08573;
    --accent-soft:#F4E5DF;
    --border:#E6DFCF;
    --danger:#A6473C;
    --danger-soft:#F3E1DE;
    --success:#3E6B4F;
    --success-soft:#E4EDE6;
    --gold:#B08D57;
    --gold-soft:#F1E9D8;
    --radius:10px;
    --shadow: 0 1px 2px rgba(42,42,36,0.06), 0 4px 16px rgba(42,42,36,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--primary-dark);
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}
  ::selection{background:var(--accent-soft);}

  #app{display:flex;min-height:100vh;}

  .sidebar{
    width:236px;flex-shrink:0;background:var(--primary);color:#F4EFE4;
    display:flex;flex-direction:column;padding:26px 18px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:0 6px 20px 6px;margin-bottom:8px;border-bottom:1px solid rgba(244,239,228,0.14);}
  .brand-logo{width:100%;max-width:170px;height:auto;display:block;}
  .brand-text .tag{font-size:10.5px;color:#C9C2AE;letter-spacing:0.02em;margin-top:2px;}

  .nav{display:flex;flex-direction:column;gap:2px;margin-top:14px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;font-size:14px;color:#DAD4C2;transition:background .15s ease, color .15s ease;}
  .nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:0.85;}
  .nav-item:hover{background:rgba(244,239,228,0.08);color:#fff;}
  .nav-item.active{background:rgba(244,239,228,0.14);color:#fff;font-weight:600;}
  .nav-spacer{flex:1;}
  .sidebar-foot{font-size:11px;color:#9C9683;padding:10px 6px 0 6px;border-top:1px solid rgba(244,239,228,0.14);margin-top:14px;}
  .sync-line{font-size:10.5px;margin-top:6px;display:flex;align-items:center;gap:6px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:#8A8470;}
  .sync-dot.ok{background:#7BC79A;}
  .sync-dot.err{background:#D98E80;}
  .sync-dot.syncing{background:#E0C989;}
  .code-box{width:100%;min-height:260px;font-family:'Courier New',monospace;font-size:11px;line-height:1.6;padding:14px;border:1px solid var(--border);border-radius:8px;background:#22392C;color:#D9E5DC;resize:vertical;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:24px 34px 18px 34px;}
  .topbar .titles h1{font-size:24px;margin:0;}
  .topbar .titles p{margin:3px 0 0 0;color:var(--ink-soft);font-size:13.5px;}
  .content{padding:0 34px 40px 34px;flex:1;}

  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;background:var(--primary);color:#fff;transition:background .15s ease, transform .1s ease;}
  .btn:hover{background:var(--primary-dark);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--border);}
  .btn.secondary:hover{background:var(--primary-soft);}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#8A382F;}
  .btn.ghost{background:transparent;color:var(--ink-soft);padding:7px 10px;}
  .btn.ghost:hover{background:var(--border);color:var(--ink);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn svg{width:15px;height:15px;}

  .grid-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px;box-shadow:var(--shadow);}
  .stat-card .label{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
  .stat-card .value{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--primary-dark);}
  .stat-card .value.accent{color:var(--accent);}
  .stat-card .value.neg{color:var(--danger);}
  .stat-card .sub{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
  .panel-head h3{font-size:15.5px;margin:0;}
  .panel-body{padding:20px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBF9F4;}
  tbody tr.month-band td{background:var(--gold-soft);color:#7A5F2B;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:0.03em;padding:9px 14px;}
  tbody tr.month-band:hover{background:var(--gold-soft);}
  tbody tr.subtotal-row td{background:var(--primary-soft);color:var(--primary-dark);font-weight:700;border-bottom:2px solid var(--primary);}
  .table-wrap{overflow-x:auto;}
  .cell-strong{font-weight:600;color:var(--ink);}
  .cell-soft{color:var(--ink-soft);font-size:12.5px;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{width:29px;height:29px;border-radius:7px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:all .15s ease;}
  .icon-btn:hover{background:var(--primary-soft);color:var(--primary-dark);border-color:var(--primary-soft);}
  .icon-btn.del:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-soft);}
  .icon-btn svg{width:14px;height:14px;}

  .badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .badge.b-new{background:var(--gold-soft);color:#8A6B31;}
  .badge.b-dp{background:var(--accent-soft);color:#9C5C48;}
  .badge.b-full{background:#E4E9F3;color:#3E5589;}
  .badge.b-done{background:var(--success-soft);color:var(--success);}
  .badge.b-cancel{background:var(--danger-soft);color:var(--danger);}
  .badge.b-active{background:var(--success-soft);color:var(--success);}
  .badge.b-inactive{background:#EDEAE1;color:var(--ink-soft);}
  .badge.b-paid{background:var(--success-soft);color:var(--success);}
  .badge.b-unpaid{background:var(--gold-soft);color:#8A6B31;}

  .empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state svg{width:38px;height:38px;margin-bottom:12px;opacity:0.5;}
  .empty-state .t{font-family:'Fraunces',serif;font-size:16px;color:var(--ink);margin-bottom:4px;}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;flex:1;min-width:180px;max-width:280px;}
  .search-box svg{width:15px;height:15px;color:var(--ink-soft);flex-shrink:0;}
  .search-box input{border:none;outline:none;background:transparent;font-size:13.5px;width:100%;color:var(--ink);}
  select.filter{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;background:var(--surface);color:var(--ink);}

  .overlay{position:fixed;inset:0;background:rgba(42,42,36,0.32);display:flex;justify-content:flex-end;z-index:50;opacity:0;pointer-events:none;transition:opacity .18s ease;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{width:460px;max-width:92vw;height:100%;background:var(--surface);box-shadow:-8px 0 28px rgba(0,0,0,0.12);display:flex;flex-direction:column;transform:translateX(16px);transition:transform .2s ease;}
  .overlay.open .drawer{transform:translateX(0);}
  .drawer-head{padding:22px 24px 16px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
  .drawer-head h3{margin:0;font-size:18px;}
  .drawer-body{padding:20px 24px;overflow-y:auto;flex:1;}
  .drawer-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;align-items:center;}
  .close-x{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0;}
  .close-x:hover{background:var(--border);}

  .field{margin-bottom:15px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;color:var(--ink);background:#FDFCFA;outline:none;transition:border-color .15s ease;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);background:#fff;}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--accent);margin:22px 0 12px 0;padding-top:14px;border-top:1px solid var(--border);}
  .section-title:first-child{margin-top:0;padding-top:0;border-top:none;}
  .kas-preview{display:flex;justify-content:space-between;align-items:center;background:var(--primary-soft);border-radius:8px;padding:12px 14px;margin-top:4px;}
  .kas-preview .lbl{font-size:12.5px;color:var(--ink-soft);}
  .kas-preview .val{font-family:'Fraunces',serif;font-weight:700;font-size:17px;color:var(--primary-dark);}
  .kas-preview .val.neg{color:var(--danger);}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--primary-dark);color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:100;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .invoice-wrap{display:flex;gap:22px;align-items:flex-start;}
  .invoice-controls{width:280px;flex-shrink:0;}
  .invoice-sheet{flex:1;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;max-width:640px;}
  .inv-header{background:var(--primary);color:#fff;padding:22px 30px;display:flex;justify-content:space-between;align-items:center;}
  .inv-header .brandname{font-family:'Fraunces',serif;font-size:19px;letter-spacing:0.12em;font-weight:600;}
  .inv-header .brand-logo-img{height:34px;width:auto;display:block;}
  .inv-header .contact{text-align:right;font-size:11px;line-height:1.7;color:#EDE8DA;}
  .inv-title-wrap{text-align:center;padding:22px 30px 6px 30px;}
  .inv-title-wrap .t{font-family:'Fraunces',serif;font-size:24px;letter-spacing:0.35em;color:var(--primary-dark);font-weight:600;}
  .inv-title-wrap .n{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .inv-body{padding:8px 30px 26px 30px;}
  .inv-to-date{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 0 18px 0;}
  .inv-to-date .lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:6px;font-weight:700;}
  .inv-to-date .client{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin-bottom:3px;}
  .inv-to-date .phone{font-size:12.5px;color:var(--ink-soft);}
  .inv-to-date .dateside{text-align:right;}
  .inv-to-date .dateval{font-size:13.5px;margin-top:6px;}
  .inv-table{width:100%;border-collapse:collapse;margin:6px 0 18px 0;}
  .inv-table th{background:var(--primary);color:#fff;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;padding:9px 14px;}
  .inv-table th:first-child{width:34px;}
  .inv-table th:last-child, .inv-table td:last-child{text-align:right;white-space:nowrap;}
  .inv-table td{padding:14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top;}
  .inv-pkg-name{font-family:'Fraunces',serif;font-weight:700;font-size:14.5px;margin-bottom:6px;}
  .inv-pkg-items{margin:0;padding-left:16px;color:var(--ink-soft);font-size:12.5px;line-height:1.75;}
  .inv-pay-wrap{display:flex;justify-content:space-between;gap:24px;padding-top:6px;}
  .inv-pay-left{font-size:12.5px;}
  .inv-pay-left .lbl{font-weight:700;color:var(--primary-dark);margin-bottom:6px;}
  .inv-pay-left .bankline{color:var(--ink-soft);line-height:1.6;white-space:pre-line;}
  .inv-pay-right{width:230px;font-size:13px;}
  .inv-pay-right .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);color:var(--ink-soft);}
  .inv-pay-right .row.remaining{border:none;margin-top:8px;padding-top:10px;border-top:2px solid var(--primary);}
  .inv-pay-right .row.remaining span:first-child{font-weight:700;color:var(--primary-dark);}
  .inv-pay-right .row.remaining span:last-child{font-family:'Fraunces',serif;font-weight:700;font-size:16px;color:var(--primary-dark);}
  .inv-event-band{background:var(--primary);color:#fff;text-align:center;padding:18px 20px;font-size:12.5px;line-height:2;}
  .inv-event-band b{font-weight:600;}
  .inv-terms{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;padding:14px 30px 20px 30px;font-size:10px;color:var(--ink-soft);font-style:italic;line-height:1.6;}

  /* ---------- Halaman Klien (Isi Data) ---------- */
  .client-shell{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:32px 20px;
    background:
      radial-gradient(circle at 12% 8%, rgba(192,133,115,0.10) 0%, transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(176,141,87,0.10) 0%, transparent 45%),
      var(--bg);
  }
  .client-card{width:100%;max-width:460px;background:var(--surface);border-radius:22px;box-shadow:0 8px 40px rgba(28,27,25,0.14);overflow:hidden;}
  .client-hero{background:linear-gradient(165deg, #2E2B26 0%, #1C1A17 100%);padding:48px 36px 38px 36px;text-align:center;position:relative;}
  .client-hero .flourish{width:64px;height:auto;margin:0 auto 22px auto;display:block;opacity:0.85;}
  .client-hero .client-logo{width:190px;max-width:75%;margin:0 auto 24px auto;display:block;}
  .client-hero .rule{width:36px;height:1px;background:rgba(216,181,128,0.5);margin:0 auto 20px auto;}
  .client-hero h1{color:#fff;font-family:'Fraunces',serif;font-size:23px;font-weight:500;margin:0 0 10px 0;letter-spacing:0.01em;}
  .client-hero p{color:#D7CFC0;font-size:13.5px;margin:0;line-height:1.75;max-width:300px;margin-left:auto;margin-right:auto;}
  .client-body{padding:38px 36px 34px 36px;}
  .client-body h2{font-family:'Fraunces',serif;font-size:19px;font-weight:500;margin:0 0 6px 0;color:var(--primary-dark);}
  .client-body .sub{font-size:13px;color:var(--ink-soft);margin:0 0 26px 0;line-height:1.7;}
  .client-cta{
    width:100%;justify-content:center;padding:14px;font-size:14px;letter-spacing:0.02em;
    background:var(--accent);border-radius:11px;
  }
  .client-cta:hover{background:#A96F5E;}
  .client-form .group-label{
    font-size:10.5px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;
    color:var(--accent);margin:26px 0 14px 0;
  }
  .client-form .group-label:first-child{margin-top:0;}
  .client-form .field{margin-bottom:16px;}
  .client-form .field label{
    font-size:12px;font-weight:600;color:var(--ink);margin-bottom:7px;
    display:flex;align-items:center;gap:6px;
  }
  .client-form .field label .req{color:var(--danger);font-weight:700;}
  .client-form .field label .opt{color:var(--ink-soft);font-weight:400;text-transform:none;letter-spacing:0;font-size:11.5px;}
  .client-form .field label svg{width:13px;height:13px;color:var(--accent);flex-shrink:0;}
  .client-form .field input,
  .client-form .field select,
  .client-form .field textarea{
    padding:12px 14px;border-radius:11px;border:1.5px solid var(--border);
    font-size:14px;background:#FDFCFA;transition:border-color .15s ease, box-shadow .15s ease;
    width:100%;font-family:'Inter',sans-serif;
  }
  .client-form .field textarea{min-height:80px;resize:vertical;}
  .client-form .field input:focus,
  .client-form .field select:focus,
  .client-form .field textarea:focus{
    border-color:var(--accent);box-shadow:0 0 0 3px rgba(192,133,115,0.14);background:#fff;
  }
  .client-form .field-row{display:flex;gap:12px;}
  .client-form .field-row .field{flex:1;}
  .addon-list{display:flex;flex-direction:column;gap:8px;}
  .addon-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--border);border-radius:11px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;background:#FDFCFA;}
  .addon-item:has(input:checked){border-color:var(--accent);background:var(--accent-soft);}
  .addon-item input{width:auto;flex-shrink:0;}
  .addon-item .addon-price{margin-left:auto;color:var(--ink-soft);font-size:12px;}
  .maps-hint{background:var(--primary-soft);border-radius:10px;padding:11px 13px;font-size:11.5px;color:var(--primary-dark);line-height:1.65;margin-top:8px;}
  .maps-btn{width:100%;justify-content:center;border-radius:11px;padding:10px;font-size:13px;margin-top:9px;}
  .client-thanks{padding:56px 36px 50px 36px;text-align:center;}
  .client-thanks .check{
    width:64px;height:64px;border-radius:50%;
    background:linear-gradient(165deg, var(--success) 0%, #2E5A41 100%);
    color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 22px auto;
    box-shadow:0 6px 20px rgba(62,107,79,0.3);
  }
  .client-thanks .check svg{width:30px;height:30px;}
  .client-thanks h2{font-family:'Fraunces',serif;font-size:21px;font-weight:500;margin:0 0 10px 0;color:var(--primary-dark);}
  .client-thanks p{font-size:13.5px;color:var(--ink-soft);line-height:1.75;max-width:300px;margin:0 auto;}
  .client-foot{text-align:center;padding:0 36px 30px 36px;font-size:11px;color:var(--ink-soft);letter-spacing:0.02em;}
  .nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;padding:1px 7px;min-width:18px;text-align:center;}
  .pending-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px;}
  .pending-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
  .pending-card .name{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
  .pending-card .meta{font-size:12.5px;color:var(--ink-soft);line-height:1.9;margin-bottom:12px;}
  .pending-card .meta b{color:var(--ink);font-weight:600;}
  .pending-card .actions{display:flex;gap:10px;}

  @media print{
    @page{ size: A4; margin: 0; }
    .sidebar,.topbar,.invoice-controls,.toast{display:none !important;}
    .content{padding:0;}
    body{background:#fff;}
    .invoice-wrap{display:block;}
    .invoice-sheet{
      box-shadow:none;border:none;max-width:none;width:210mm;min-height:297mm;
      margin:0 auto;padding:14mm 14mm;box-sizing:border-box;
    }
    .inv-header,.inv-title-wrap,.inv-pay-wrap,.inv-event-band,.inv-terms{page-break-inside:avoid;}
    .inv-table thead{display:table-header-group;}
    .inv-table tr{page-break-inside:avoid;}
  }

  .hamburger{display:none;}
  @media (max-width: 900px){

const APPS_SCRIPT_CODE = "// Setangkai Project - Cloud Database + Google Calendar Sync (Google Apps Script)\n" +
"// Cara pakai ada di halaman Pengaturan & Backup aplikasi.\n" +
"\n" +
"function doGet(e) {\n" +
"  var sheet = getDataSheet_();\n" +
"  var raw = sheet.getRange('A1').getValue();\n" +
"  return jsonOutput_({ok: true, data: raw ? JSON.parse(raw) : null});\n" +
"}\n" +
"\n" +
"function doPost(e) {\n" +
"  try {\n" +
"    var body = e.postData.contents;\n" +
"    var newData = JSON.parse(body); // validasi JSON\n" +
"    var sheet = getDataSheet_();\n" +
"    var oldRaw = sheet.getRange('A1').getValue();\n" +
"    var oldData = oldRaw ? JSON.parse(oldRaw) : null;\n" +
"\n" +
"    syncCalendar_(oldData, newData); // menambah/mengubah/menghapus event di Google Calendar\n" +
"\n" +
"    var finalJson = JSON.stringify(newData);\n" +
"    sheet.getRange('A1').setValue(finalJson);\n" +
"    sheet.getRange('B1').setValue(new Date());\n" +
"    writeRingkasan_(newData);\n" +
"    return jsonOutput_({ok: true, data: newData});\n" +
"  } catch (err) {\n" +
"    return jsonOutput_({ok: false, error: String(err)});\n" +
"  }\n" +
"}\n" +
"\n" +
"function jsonOutput_(obj) {\n" +
"  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);\n" +
"}\n" +
"\n" +
"function getDataSheet_() {\n" +
"  var ss = SpreadsheetApp.getActiveSpreadsheet();\n" +
"  var sheet = ss.getSheetByName('Database');\n" +
"  if (!sheet) {\n" +
"    sheet = ss.insertSheet('Database');\n" +
"    sheet.getRange('A1').setValue('');\n" +
"  }\n" +
"  return sheet;\n" +
"}\n" +
"\n" +
"// ============ SINKRONISASI GOOGLE CALENDAR ============\n" +
"function syncCalendar_(oldData, newData) {\n" +
"  var cal = CalendarApp.getDefaultCalendar();\n" +
"  var oldEvents = (oldData && oldData.events) || [];\n" +
"  var newEvents = newData.events || [];\n" +
"\n" +
"  var oldById = {};\n" +
"  oldEvents.forEach(function(ev) { oldById[ev.id] = ev; });\n" +
"  var newIds = {};\n" +
"  newEvents.forEach(function(ev) { newIds[ev.id] = true; });\n" +
"\n" +
"  // hapus event Calendar untuk booking yang sudah dihapus dari aplikasi\n" +
"  oldEvents.forEach(function(oldEv) {\n" +
"    if (!newIds[oldEv.id] && oldEv.gcalEventId) {\n" +
"      deleteCalendarEvent_(cal, oldEv.gcalEventId);\n" +
"    }\n" +
"  });\n" +
"\n" +
"  // Supaya SETIAP kali simpan tidak perlu memanggil Calendar API untuk semua\n" +
"  // event (lambat!), hanya event yang datanya benar-benar berubah (baru,\n" +
"  // diedit, atau penugasan timnya berubah) yang diproses di sini.\n" +
"  var CAL_FIELDS = ['date','waktuAcara','acara','pasangan','name','status','job','coordinator','notes','shareloc','venue','invoiceNo'];\n" +
"  newEvents.forEach(function(ev) {\n" +
"    if (!ev.date) return;\n" +
"    var oldEv = oldById[ev.id];\n" +
"    var changed = !oldEv || !ev.gcalEventId;\n" +
"    if (!changed) {\n" +
"      for (var i = 0; i < CAL_FIELDS.length; i++) {\n" +
"        if ((oldEv[CAL_FIELDS[i]] || '') !== (ev[CAL_FIELDS[i]] || '')) { changed = true; break; }\n" +
"      }\n" +
"    }\n" +
"    if (!changed && JSON.stringify(assignmentFingerprint_(oldData, ev.id)) !== JSON.stringify(assignmentFingerprint_(newData, ev.id))) {\n" +
"      changed = true;\n" +
"    }\n" +
"    if (!changed) return;\n" +
"\n" +
"    if (ev.status === 'Batal') {\n" +
"      if (ev.gcalEventId) {\n" +
"        deleteCalendarEvent_(cal, ev.gcalEventId);\n" +
"        ev.gcalEventId = '';\n" +
"      }\n" +
"      return;\n" +
"    }\n" +
"\n" +
"    var range = parseWaktuAcara_(ev.date, ev.waktuAcara);\n" +
"    if (!range) return;\n" +
"\n" +
"    var title = (ev.acara || 'Acara') + ' - ' + (ev.pasangan || ev.name || 'Klien');\n" +
"    var desc = buildEventDescription_(ev, newData);\n" +
"    var location = ev.shareloc || ev.venue || '';\n" +
"\n" +
"    var existing = ev.gcalEventId ? getCalendarEventSafe_(cal, ev.gcalEventId) : null;\n" +
"    if (existing && existing.isAllDayEvent() !== range.allDay) {\n" +
"      // Tipe event berubah (jam tertentu <-> sepanjang hari) - Calendar API tidak\n" +
"      // bisa mengubah tipe event yang sama, jadi hapus lalu buat ulang.\n" +
"      deleteCalendarEvent_(cal, ev.gcalEventId);\n" +
"      existing = null;\n" +
"    }\n" +
"\n" +
"    if (existing) {\n" +
"      existing.setTitle(title);\n" +
"      existing.setDescription(desc);\n" +
"      existing.setLocation(location);\n" +
"      if (range.allDay) {\n" +
"        existing.setAllDayDate(range.start);\n" +
"      } else {\n" +
"        existing.setTime(range.start, range.end);\n" +
"      }\n" +
"      applyH5Reminder_(existing, range);\n" +
"    } else {\n" +
"      var created;\n" +
"      if (range.allDay) {\n" +
"        created = cal.createAllDayEvent(title, range.start, {description: desc, location: location});\n" +
"      } else {\n" +
"        created = cal.createEvent(title, range.start, range.end, {description: desc, location: location});\n" +
"      }\n" +
"      applyH5Reminder_(created, range);\n" +
"      ev.gcalEventId = created.getId();\n" +
"    }\n" +
"  });\n" +
"}\n" +
"\n" +
"function assignmentFingerprint_(data, eventId) {\n" +
"  return ((data && data.assignments) || [])\n" +
"    .filter(function(a) { return a.eventId === eventId; })\n" +
"    .map(function(a) { return a.teamId + ':' + (a.role || ''); })\n" +
"    .sort();\n" +
"}\n" +
"\n" +
"// Membaca jam acara dari format \\\"07.00 - 17.00\\\". Kalau tidak ada / tidak\n" +
"// dikenali formatnya, event dibuat sepanjang hari (all-day) tanpa reminder jam 5 pagi.\n" +
"function parseWaktuAcara_(dateStr, waktuAcara) {\n" +
"  var baseDate = new Date(dateStr + 'T00:00:00');\n" +
"  if (isNaN(baseDate.getTime())) return null;\n" +
"  if (!waktuAcara) return {allDay: true, start: baseDate};\n" +
"  var m = String(waktuAcara).match(/(\\d{1,2})[.:](\\d{2})\\s*-\\s*(\\d{1,2})[.:](\\d{2})/);\n" +
"  if (!m) return {allDay: true, start: baseDate};\n" +
"  var start = new Date(dateStr + 'T00:00:00');\n" +
"  start.setHours(parseInt(m[1], 10), parseInt(m[2], 10), 0, 0);\n" +
"  var end = new Date(dateStr + 'T00:00:00');\n" +
"  end.setHours(parseInt(m[3], 10), parseInt(m[4], 10), 0, 0);\n" +
"  if (end <= start) end = new Date(start.getTime() + 2 * 60 * 60 * 1000);\n" +
"  return {allDay: false, start: start, end: end};\n" +
"}\n" +
"\n" +
"// Mengatur reminder popup supaya berbunyi jam 05:00 pagi di hari-H (bukan\n" +
"// sekian menit sebelum acara seperti reminder default Calendar).\n" +
"function applyH5Reminder_(calEvent, range) {\n" +
"  try {\n" +
"    calEvent.removeAllReminders();\n" +
"    if (range.allDay) return;\n" +
"    var fiveAm = new Date(range.start.getFullYear(), range.start.getMonth(), range.start.getDate(), 5, 0, 0);\n" +
"    var diffMinutes = Math.round((range.start.getTime() - fiveAm.getTime()) / 60000);\n" +
"    calEvent.addPopupReminder(diffMinutes > 0 ? diffMinutes : 0);\n" +
"  } catch (err) {\n" +
"    // kalau gagal diatur, biarkan tanpa reminder custom\n" +
"  }\n" +
"}\n" +
"\n" +
"function getCalendarEventSafe_(cal, id) {\n" +
"  try {\n" +
"    return cal.getEventById(id);\n" +
"  } catch (err) {\n" +
"    return null;\n" +
"  }\n" +
"}\n" +
"\n" +
"function deleteCalendarEvent_(cal, id) {\n" +
"  try {\n" +
"    var ev = getCalendarEventSafe_(cal, id);\n" +
"    if (ev) ev.deleteEvent();\n" +

"    // event sudah tidak ada di Calendar, abaikan\n" +

"}\n" +
"\n" +
"function buildEventDescription_(ev, data) {\n" +

"    if (a.eventId !== ev.id) return;\n" +
"    var tm = ((data && data.team) || []).filter(function(t) { return t.id === a.teamId; })[0];\n" +
"    if (tm) teamLines.push((a.role || tm.role || 'Tim') + ': ' + tm.name);\n" +
"  });\n" +

"  if (ev.status) lines.push('Status: ' + ev.status);\n" +

"  lines.push('Dibuat otomatis dari Setangkai Project - Sistem Manajemen');\n" +

"}\n" +
"\n" +
"// ============ RINGKASAN KEUANGAN (sheet yang bisa dibaca manusia) ============\n" +
"function writeRingkasan_(data) {\n" +
"  var ss = SpreadsheetApp.getActiveSpreadsheet();\n" +

const DEFAULT_CLOUD_URL = "https://script.google.com/macros/s/AKfycbxQB4d609udJy6VCFjc87UtTtv8YeAvigYm0i5c_pj8nRVRunBqqOaUsPQZv7vt-i5p/exec";

function loadCloudUrl(){
  try{
    const saved = localStorage.getItem('setangkai-cloud-url');
    if(saved === '__NONE__') return ""; // pengguna sengaja memutus sambungan di browser ini
    if(saved) return saved;
  }catch(e){ /* localStorage tidak tersedia */ }
  return DEFAULT_CLOUD_URL || "";
}
function saveCloudUrl(url){
  try{ localStorage.setItem('setangkai-cloud-url', url ? url : '__NONE__'); }catch(e){}
}
async function fetchRemoteState(url){
  const res = await fetch(url, {method:'GET'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Respons tidak valid');
  return json.data;
}
async function pushRemoteState(url, data){
  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // hindari CORS preflight di Apps Script
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Gagal menyimpan ke cloud');
  return json.data || null; // server bisa mengembalikan data yang sudah dilengkapi (mis. ID event Google Calendar)
}

const STORAGE_KEY = "setangkai-data-v4";

async function loadState(){
  cloudUrl = loadCloudUrl();
  if(cloudUrl){
    try{
      syncStatus = 'syncing';
      const remote = await fetchRemoteState(cloudUrl);
      if(remote && Array.isArray(remote.events)){
        syncStatus = 'synced'; lastSyncAt = new Date();
        normalizeState(remote);
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(remote)); }catch(e){}
        return remote;
      }
      syncStatus = 'synced'; lastSyncAt = new Date();
      // sheet cloud kosong -> lanjut pakai data lokal, akan otomatis terunggah saat tersimpan berikutnya
    }catch(e){
      console.error('Sinkron awal gagal:', e);
      syncStatus = 'offline';
    }
  }
  // 1) coba penyimpanan bawaan Claude (kalau file ini dibuka lewat Claude)
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){ return normalizeState(JSON.parse(res.value)); }
  }catch(e){ /* tidak tersedia / belum ada data -> lanjut cek localStorage */ }
  // 2) fallback: localStorage browser (dipakai saat file dibuka langsung di browser)
  try{
    const local = localStorage.getItem(STORAGE_KEY);
    if(local) return normalizeState(JSON.parse(local));
  }catch(e){ /* localStorage tidak tersedia (mode private/incognito, dsb) */ }
  // 3) belum ada data sama sekali -> mulai dari data contoh
  const seed = seedData();
  await persistState(seed);
  return seed;
}

async function persist(){
  await persistState(state);
}

async function persistState(data){
  const json = JSON.stringify(data);
  let savedSomewhere = false;
  try{
    const r = await window.storage.set(STORAGE_KEY, json, false);
    if(r) savedSomewhere = true;
  }catch(e){ /* penyimpanan bawaan Claude tidak tersedia di konteks ini */ }
  try{
    localStorage.setItem(STORAGE_KEY, json);
    savedSomewhere = true;
  }catch(e){ /* localStorage tidak tersedia */ }
  if(cloudUrl){
    try{
      syncStatus = 'syncing';
      const updated = await pushRemoteState(cloudUrl, data);
      if(updated && Array.isArray(updated.events) && state){
        normalizeState(updated);
        state = updated; // pakai versi dari server (mis. sudah dilengkapi ID Google Calendar)
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
      }
      syncStatus = 'synced'; lastSyncAt = new Date();
      savedSomewhere = true;
    }catch(e){
      console.error('Sinkron ke cloud gagal:', e);
      syncStatus = 'error';
      showToast('Tersimpan di perangkat ini, tapi gagal sinkron ke cloud.');
    }
  }
  if(!savedSomewhere){
    console.error("Gagal menyimpan data di mana pun.");
    showToast("Gagal menyimpan data. Gunakan tombol Unduh Backup agar data tidak hilang.");
  }
}

async function connectCloud(){
  const input = document.getElementById('cloud-url-input');
  const url = input.value.trim();
  if(!url || !url.startsWith('http')){ showToast('URL Web App tidak valid'); return; }
  syncStatus = 'syncing'; render();
  try{
    const remote = await fetchRemoteState(url);
    if(remote && Array.isArray(remote.events) && remote.events.length){
      const useRemote = confirm('Ditemukan data yang sudah ada di cloud.\n\nKlik OK untuk MEMAKAI data cloud (menimpa data di perangkat ini).\nKlik Cancel untuk MENGUNGGAH data perangkat ini ke cloud (menimpa data cloud).');
      if(useRemote){
        state = normalizeState(remote);
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
      } else {
        await pushRemoteState(url, state);
      }
    } else {
      await pushRemoteState(url, state);
    }
    saveCloudUrl(url);
    cloudUrl = url;
    syncStatus = 'synced'; lastSyncAt = new Date();
    showToast('Berhasil tersambung ke cloud');
  }catch(e){
    console.error(e);
    syncStatus = 'error';
    showToast('Gagal terhubung. Cek URL & pastikan deployment diakses "Anyone".');
  }
  render();
}
function disconnectCloud(){
  if(!confirm('Putuskan sinkronisasi cloud? Data tetap aman tersimpan di perangkat ini.')) return;
  saveCloudUrl('');
  cloudUrl = '';
  syncStatus = 'idle';
  showToast('Sinkronisasi cloud dinonaktifkan di perangkat ini');
  render();
}
async function syncNow(){
  if(!cloudUrl){ showToast('Belum tersambung ke cloud'); return; }
  syncStatus = 'syncing'; render();
  try{
    const remote = await fetchRemoteState(cloudUrl);
    if(remote && Array.isArray(remote.events)){
      state = normalizeState(remote);
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    }
    await pushRemoteState(cloudUrl, state);
    syncStatus = 'synced'; lastSyncAt = new Date();
    showToast('Sinkron berhasil');
  }catch(e){
    console.error(e);
    syncStatus = 'error';
    showToast('Sinkron gagal — cek koneksi internet / URL');
  }
  render();
}

function groupByMonth(list){
  const groups = {};
  const order = [];
  list.forEach(item=>{
    const key = monthKey(item.date);
    if(!groups[key]){ groups[key]=[]; order.push(key); }
    groups[key].push(item);
  });
  return order.map(key=>({key, items:groups[key]}));
}

    if(!e.date) return false;
    const d = new Date(e.date+"T00:00:00");
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }).length;

  let totalBudget=0, totalDiterima=0, totalPiutang=0, totalBiaya=0, totalKas=0;
  state.events.forEach(e=>{
    const t = eventTotals(e.id);
    totalBudget += t.budget; totalDiterima += t.diterima; totalPiutang += t.piutang; totalBiaya += t.biaya; totalKas += t.kas;
  });

  const statusCounts = {};
  STATUS_LIST.forEach(s=>statusCounts[s]=0);
  state.events.forEach(e=>{ if(statusCounts[e.status]!==undefined) statusCounts[e.status]++; });

  const upcoming = state.events
    .filter(e=>e.date && new Date(e.date+"T00:00:00") >= new Date(now.toDateString()))
    .sort((a,b)=> new Date(a.date) - new Date(b.date))
    .slice(0,5);

  return `
    <div class="grid-stats">
      <div class="stat-card"><div class="label">Total Event</div><div class="value">${totalEvent}</div><div class="sub">${eventBulanIni} event bulan ini</div></div>
      <div class="stat-card"><div class="label">Total Budget</div><div class="value">${fmtMoney(totalBudget)}</div><div class="sub">Diterima ${fmtMoney(totalDiterima)} · Piutang ${fmtMoney(totalPiutang)}</div></div>
      <div class="stat-card"><div class="label">Total Biaya</div><div class="value">${fmtMoney(totalBiaya)}</div><div class="sub">Foto, video, FD, cetak, crew, transport, dll</div></div>
      <div class="stat-card"><div class="label">Total Kas</div><div class="value ${totalKas<0?'neg':'accent'}">${fmtMoney(totalKas)}</div><div class="sub">Budget dikurangi seluruh biaya</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start;">
      <div class="panel">
        <div class="panel-head"><h3>Event Mendatang</h3></div>
        <div class="table-wrap">
          ${upcoming.length? `
          <table>
            <thead><tr><th>Klien</th><th>Tanggal</th><th>Lokasi</th><th>Status</th></tr></thead>
            <tbody>
              ${upcoming.map(e=>`
                <tr>
                  <td class="cell-strong">${e.name}</td>
                  <td>${fmtDate(e.date)}<div class="cell-soft">${fmtDay(e.date)}</div></td>
                  <td>${e.venue||'-'}</td>
                  <td><span class="badge ${STATUS_BADGE[e.status]||''}">${e.status}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>` : emptyState("Belum ada event mendatang", "Tambahkan event baru di halaman Jadwal Event.")}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Status Event</h3></div>
        <div class="panel-body" style="display:flex;flex-direction:column;gap:12px;">
          ${STATUS_LIST.map(s=>`
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <span class="badge ${STATUS_BADGE[s]}">${s}</span>
              <span class="cell-strong">${statusCounts[s]}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function emptyState(title, sub){
  return `<div class="empty-state">${ICONS.empty}<div class="t">${title}</div><div>${sub}</div></div>`;

/* ---------------- Booking Masuk (dari formulir klien) ---------------- */
function renderBookingMasuk(){

  if(!rows.length){
    return emptyState("Belum ada booking masuk", "Booking yang diisi klien lewat formulir online akan muncul di sini untuk ditinjau sebelum jadi event resmi.");
  }
  return rows.map(b=>`
    <div class="pending-card">
      <div class="top">
        <div>

          <div class="cell-soft">Diisi ${b.submittedAt? new Date(b.submittedAt).toLocaleString('id-ID') : ''}</div>
        </div>
        <span class="badge b-new">Menunggu Persetujuan</span>
      </div>
      <div class="meta">
        <div><b>Nama Pemesan</b> : ${b.pemesan || '-'}</div>
        <div><b>Nomor WhatsApp</b> : ${b.waNumber || '-'}</div>
        <div><b>Instagram</b> : ${b.instagram || '-'}</div>
        <div><b>Jenis Acara</b> : ${b.acara || '-'}</div>
        <div><b>Tanggal Acara</b> : ${fmtDate(b.date)}</div>

        <div><b>Catatan</b> : ${b.notes || '-'}</div>
        <div><b>Lokasi Acara</b> : ${b.venue || '-'}</div>
        <div><b>Shareloc</b> : ${b.shareloc? `<a href="${b.shareloc}" target="_blank" style="color:var(--primary);">Lihat di Maps</a>` : '-'}</div>
      </div>
      <div class="actions">
        <button class="btn" onclick="approveBooking('${b.id}')">${ICONS.check} Setujui &amp; Buat Event</button>
        <button class="btn secondary" onclick="rejectBooking('${b.id}')">Tolak</button>
      </div>
    </div>
  `).join('');
}
async function approveBooking(id){
  const b = (state.pendingBookings||[]).find(x=>x.id===id);
  if(!b) return;
  if(!confirm(`Setujui booking dari "${b.name}"? Event baru akan dibuat di Jadwal Event.`)) return;
  const pkg = b.packageId ? packageById(b.packageId) : null;
  const newId = uid('EV', state.counters.event++);
  const addonLines = (b.addons||[]).map(a=>'+ ' + a.name + ' (' + fmtMoney(a.price) + ')');
  const baseItems = pkg ? pkg.items : '';
  const packageItems = [baseItems, ...addonLines].filter(Boolean).join('\n');
  const notesParts = [];
  if(b.notes) notesParts.push('Catatan klien: ' + b.notes);
  notesParts.push('Diisi mandiri oleh klien lewat formulir online');
  state.events.push({
    id:newId, invoiceNo:"", name:b.pemesan||b.name||"", clientPhone:b.waNumber||"", pasangan:b.name||"",
    acara:b.acara||"", job: pkg? pkg.name : "", packageName: pkg? pkg.name : (b.packageName||""),
    packageItems, waktuAcara:b.waktuAcara||"", date:b.date||"",
    venue:b.venue||"", instagram:b.instagram||"", shareloc:b.shareloc||"",
    coordinator:"", status:"Booking Baru", notes:notesParts.join('\n')
  });
  state.finance[newId] = {budget: pkg? pkg.price : 0, dp:0, pelunasan:0, biayaFoto:0, biayaVideo:0, biayaFD:0, biayaCetak:0, biayaCrew:0, biayaTransport:0, biayaLain:0};
  state.pendingBookings = state.pendingBookings.filter(x=>x.id!==id);
  await persist();
  render();
  showToast("Booking disetujui — event baru sudah dibuat");
}
async function rejectBooking(id){
  if(!confirm("Tolak dan hapus booking ini?")) return;
  state.pendingBookings = (state.pendingBookings||[]).filter(x=>x.id!==id);
  await persist();
  render();
  showToast("Booking ditolak");
}

/* ---------------- Jadwal Event ---------------- */
function renderJadwal(){
  let rows = state.events.slice().sort((a,b)=> new Date(a.date||0) - new Date(b.date||0));
  if(searchTerm) rows = rows.filter(e => (e.name+" "+e.venue+" "+(e.invoiceNo||'')).toLowerCase().includes(searchTerm.toLowerCase()));
  if(statusFilter!=='Semua') rows = rows.filter(e=>e.status===statusFilter);
  const groups = groupByMonth(rows);

  return `
    <div class="toolbar">
      <div class="search-box">${ICONS.search}<input placeholder="Cari klien / lokasi / no. invoice..." value="${searchTerm}" oninput="onSearch(this.value)"></div>
      <select class="filter" onchange="onFilterStatus(this.value)">
        <option value="Semua" ${statusFilter==='Semua'?'selected':''}>Semua Status</option>
        ${STATUS_LIST.map(s=>`<option value="${s}" ${statusFilter===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
    <div class="panel">
      <div class="table-wrap">
        ${rows.length? `
        <table>
          <thead><tr><th>No. Invoice</th><th>Klien</th><th>Acara</th><th>Tanggal</th><th>Lokasi</th><th>Job</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${groups.map(g=>`
              <tr class="month-band"><td colspan="8">${g.key}</td></tr>
              ${g.items.map(e=>`
                <tr>
                  <td class="cell-soft">${e.invoiceNo||'-'}</td>
                  <td class="cell-strong">${e.name}</td>
                  <td>${e.acara||'-'}</td>
                  <td>${fmtDate(e.date)}<div class="cell-soft">${fmtDay(e.date)}</div></td>
                  <td>${e.venue||'-'}</td>
                  <td>${e.job||'-'}</td>
                  <td><span class="badge ${STATUS_BADGE[e.status]||''}">${e.status}</span></td>
                  <td>
                    <div class="row-actions">
                      <div class="icon-btn" onclick="openEventForm('${e.id}')">${ICONS.edit}</div>
                      <div class="icon-btn del" onclick="deleteEvent('${e.id}')">${ICONS.trash}</div>

}

function prefillPackage(){
  const pkgId = document.getElementById('f-pkgPick').value;
  const pk = packageById(pkgId);
  if(pk){
    document.getElementById('f-packageName').value = pk.name;
    document.getElementById('f-packageItems').value = pk.items;
    document.getElementById('f-budget').value = pk.price;
    updateKasPreview();
  }
  if(captureCurrentDraft) captureCurrentDraft();
}
function updateKasPreview(){
  const budget = Number(document.getElementById('f-budget').value)||0;
  const biaya = COST_FIELDS.reduce((s,c)=> s + (Number(document.getElementById('f-'+c.key).value)||0), 0);
  const kas = budget - biaya;
  const el = document.getElementById('kas-preview-val');
  el.textContent = fmtMoney(kas);
  el.className = "val" + (kas<0? " neg":"");
}
async function deleteEvent(id){
  if(!confirm("Hapus event ini? Penugasan tim dan data keuangan terkait juga akan terhapus.")) return;
  state.events = state.events.filter(e=>e.id!==id);
  state.assignments = state.assignments.filter(a=>a.eventId!==id);
  delete state.finance[id];
  await persist();
  render();
  showToast("Event dihapus");
}

/* ---------------- Keuangan (ledger ala pembukuan manual) ---------------- */
function renderKeuangan(){
  let rows = state.events.slice().sort((a,b)=> new Date(a.date||0) - new Date(b.date||0));
  const groups = groupByMonth(rows);
  const colCount = 10;

  function sumRow(items, label){
    let budget=0, biaya={}, kas=0;
    COST_FIELDS.forEach(c=>biaya[c.key]=0);
    items.forEach(e=>{
      const t = eventTotals(e.id);
      budget += t.budget; kas += t.kas;
      const f = getFinance(e.id);
      COST_FIELDS.forEach(c=> biaya[c.key]+=Number(f[c.key]||0));
    });
    return `<tr class="subtotal-row">
      <td colspan="2">${label}</td>
      <td>${fmtMoney(budget)}</td>
      ${COST_FIELDS.map(c=>`<td>${fmtMoney(biaya[c.key])}</td>`).join('')}
      <td>${fmtMoney(kas)}</td>
    </tr>`;
  }

  return `
    <div class="panel">
      <div class="table-wrap">
        ${rows.length? `
        <table>
          <thead><tr>
            <th>No. Invoice</th><th>Klien</th><th>Budget</th><th>Foto</th><th>Video</th><th>FD</th><th>Cetak</th><th>Crew</th><th>Transport</th><th>Dll</th><th>Kas</th><th></th>
          </tr></thead>
          <tbody>
            ${groups.map(g=>{
              const rowsHtml = g.items.map(e=>{
                const f = getFinance(e.id);
                const t = eventTotals(e.id);
                return `
                <tr>
                  <td class="cell-soft">${e.invoiceNo||'-'}</td>
                  <td class="cell-strong">${e.name}<div class="cell-soft">${fmtDate(e.date)}</div></td>
                  <td>${fmtMoney(t.budget)}</td>
                  <td>${fmtMoney(f.biayaFoto)}</td>
                  <td>${fmtMoney(f.biayaVideo)}</td>
                  <td>${fmtMoney(f.biayaFD)}</td>
                  <td>${fmtMoney(f.biayaCetak)}</td>
                  <td>${fmtMoney(f.biayaCrew)}</td>
                  <td>${fmtMoney(f.biayaTransport)}</td>
                  <td>${fmtMoney(f.biayaLain)}</td>
                  <td style="color:${t.kas<0?'var(--danger)':(t.kas>0?'var(--success)':'var(--ink-soft)')};font-weight:700;">${fmtMoney(t.kas)}</td>
                  <td><div class="row-actions"><div class="icon-btn" onclick="openEventForm('${e.id}')">${ICONS.edit}</div></div></td>
                </tr>`;
              }).join('');
              return `<tr class="month-band"><td colspan="12">${g.key}</td></tr>${rowsHtml}${sumRow(g.items, 'Rekap '+g.key)}`;
            }).join('')}
          </tbody>
        </table>` : emptyState("Belum ada event", "Tambahkan event di halaman Jadwal Event terlebih dahulu.")}
      </div>
    </div>
  `;
}

        Kalau kamu buka dari HP dan laptop secara bergantian, datanya <b>tidak otomatis sinkron</b> antar keduanya karena masing-masing tersimpan terpisah per perangkat/browser.
        Untuk memindahkan data antar perangkat, pakai "Unduh Backup" di perangkat lama lalu "Pulihkan dari Backup" di perangkat baru.
      </div>
    </div>
    <div class="panel" style="border-color:var(--danger-soft);">

          Mengosongkan <b>semua data transaksi</b> — event, booking masuk, tim, paket, tambahan (addon), dan keuangan — baik yang tersimpan di perangkat ini maupun di database cloud (Google Sheets), supaya kamu bisa mulai input dari nol. Info usaha (nama, WA, rekening, syarat & ketentuan) di halaman Invoice <b>tidak ikut terhapus</b>.
        </p>
        <p style="font-size:12.5px;color:var(--danger);line-height:1.6;">Tindakan ini tidak bisa dibatalkan. Sebaiknya klik "Unduh Backup (.json)" di atas dulu sebelum lanjut, jaga-jaga.</p>

async function resetAllData(){
  const step1 = confirm(
    'Ini akan MENGHAPUS SEMUA DATA (event, booking masuk, tim, paket, addon, keuangan) di perangkat ini' +
    (cloudUrl ? ' dan di database cloud (Google Sheets) — berlaku untuk semua perangkat yang tersambung' : '') +
    '.\n\nInfo usaha (nama, WA, rekening, dll) TIDAK ikut terhapus.\n\nSudah unduh backup? Tindakan ini tidak bisa dibatalkan.\n\nLanjutkan?'
  );
  if(!step1) return;
  const step2 = confirm('Konfirmasi sekali lagi: benar-benar kosongkan SEMUA data sekarang?');
  if(!step2) return;

  const fresh = seedData();
  fresh.company = (state && state.company) ? state.company : fresh.company; // pertahankan info usaha yang sudah diisi

  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  try{ await window.storage.delete(STORAGE_KEY, false); }catch(e){}

  state = normalizeState(fresh);

  if(cloudUrl){
    try{
      syncStatus = 'syncing'; render();
      await pushRemoteState(cloudUrl, state);
      syncStatus = 'synced'; lastSyncAt = new Date();
    }catch(e){
      console.error('Gagal mengosongkan data cloud:', e);
      syncStatus = 'error';
      showToast('Data di perangkat ini sudah kosong, tapi gagal mengosongkan data cloud. Coba tombol "Sinkron Sekarang".');
      await persist();
      render();
      return;
    }
  }

  await persist();
  render();
  showToast('Semua data berhasil dikosongkan — siap input dari nol');
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadBackup(){
  const stamp = new Date().toISOString().slice(0,10);
  downloadFile(`setangkai-backup-${stamp}.json`, JSON.stringify(state, null, 2), 'application/json');
  showToast("Backup diunduh");
}
function handleRestoreFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.events)){ showToast("File backup tidak valid"); return; }
      if(!confirm("Ini akan mengganti semua data saat ini dengan isi file backup. Lanjutkan?")) return;
      state = normalizeState(parsed);
      await persist();
      render();
      showToast("Data berhasil dipulihkan");
    }catch(e){
      showToast("Gagal membaca file backup");
    }
  };
  reader.readAsText(file);
  evt.target.value = '';
}
function csvEscape(v){
  const s = String(v==null? '' : v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportKeuanganCSV(){
  const headers = ["No Invoice","Nama Klien","Acara","Tanggal","Lokasi","Job","Budget","Foto","Video","FD","Cetak","Crew","Transport","Dll","Kas"];
  const rows = [headers];
  state.events.slice().sort((a,b)=> new Date(a.date||0) - new Date(b.date||0)).forEach(e=>{
    const f = getFinance(e.id);
    const t = eventTotals(e.id);
    rows.push([
      e.invoiceNo||'', e.name||'', e.acara||'', e.date||'', e.venue||'', e.job||'',
      t.budget, f.biayaFoto||0, f.biayaVideo||0, f.biayaFD||0, f.biayaCetak||0, f.biayaCrew||0, f.biayaTransport||0, f.biayaLain||0, t.kas
    ]);
  });
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const stamp = new Date().toISOString().slice(0,10);
  downloadFile(`setangkai-keuangan-${stamp}.csv`, '\uFEFF'+csv, 'text/csv;charset=utf-8;');
  showToast("File CSV diunduh");
}

function normalizePhoneForWa_(phone){
  if(!phone) return '';
  let digits = String(phone).replace(/[^0-9]/g, '');
  if(!digits) return '';
  if(digits.startsWith('0')) digits = '62' + digits.slice(1);
  else if(!digits.startsWith('62')) digits = '62' + digits;
  return digits;
}
function sendWhatsAppNotification(b){
  const phone = normalizePhoneForWa_(state.company.phone);
  if(!phone){ showToast('Nomor WA admin belum diatur di Pengaturan → Invoice'); return; }
  const addonText = (b.addons||[]).length ? b.addons.map(a=>a.name).join(', ') : '-';
  const lines = [
    'Halo ' + (state.company.name||'Setangkai Project') + ', saya ingin konfirmasi booking baru:',
    '',
    'Nama Pemesan: ' + (b.pemesan || '-'),
    'Nama & Pasangan: ' + b.name,
    'Nomor WhatsApp: ' + (b.waNumber || '-'),
    'Instagram: ' + (b.instagram || '-'),
    'Jenis Acara: ' + (b.acara || '-'),
    'Tanggal Acara: ' + fmtDate(b.date),
    'Jam Acara: ' + (b.waktuAcara || '-'),
    'Paket: ' + (b.packageName || '-'),
    'Add-On: ' + addonText,
    'Catatan: ' + (b.notes || '-'),
    'Lokasi Acara: ' + (b.venue || '-'),
    'Shareloc: ' + (b.shareloc || '-'),
    '',
    'Mohon dikonfirmasi ya. Terima kasih!'
  ];
  const text = encodeURIComponent(lines.join('\n'));
  window.open('https://wa.me/' + phone + '?text=' + text, '_blank');
}
async function submitClientForm(){
  const pemesan = document.getElementById('cf-pemesan').value.trim();
  const name = document.getElementById('cf-name').value.trim();
  const wa = document.getElementById('cf-wa').value.trim();
  const date = document.getElementById('cf-date').value;
  const waktuMulai = document.getElementById('cf-waktu-mulai').value;
  const waktuSelesai = document.getElementById('cf-waktu-selesai').value;

  if(!pemesan){ showToast('Nama Pemesan wajib diisi'); return; }
  if(!name){ showToast('Nama & Pasangan wajib diisi'); return; }
  if(!wa){ showToast('Nomor WhatsApp wajib diisi'); return; }
  if(!date){ showToast('Tanggal Acara wajib diisi'); return; }
  if(waktuMulai && waktuSelesai && waktuSelesai <= waktuMulai){
    showToast('Jam selesai tidak boleh sebelum/sama dengan jam mulai');
    return;
  }

  let packageId = '', packageName = '';
  const pkgSelect = document.getElementById('cf-package');
  if(pkgSelect){
    if(pkgSelect.value && pkgSelect.value !== '__lainnya'){
      packageId = pkgSelect.value;
      const pk = packageById(packageId);
      packageName = pk? pk.name : '';
    }
  } else {
    const pkgText = document.getElementById('cf-package-text');
    packageName = pkgText? pkgText.value.trim() : '';
  }

  const addons = Array.from(document.querySelectorAll('.cf-addon:checked')).map(el=>{
    const a = (state.addons||[]).find(x=>x.id===el.value);
    return a ? {id:a.id, name:a.name, price:a.price} : null;
  }).filter(Boolean);

  const waktuAcara = (waktuMulai && waktuSelesai) ? (waktuMulai.replace(':','.') + ' - ' + waktuSelesai.replace(':','.')) : '';

  const booking = {
    id: uid('PB', state.counters.pending++),
    pemesan,
    name,
    waNumber: wa,
    instagram: document.getElementById('cf-instagram').value.trim(),
    acara: document.getElementById('cf-acara').value.trim(),
    date,
    waktuAcara,
    packageId, packageName,
    addons,
    notes: document.getElementById('cf-notes').value.trim(),
    venue: document.getElementById('cf-venue').value.trim(),
    shareloc: document.getElementById('cf-shareloc').value.trim(),
    submittedAt: new Date().toISOString(),
  };

  // buka WhatsApp dulu selagi masih dalam konteks klik pengguna (supaya tidak diblokir popup blocker),
  // baru simpan datanya ke database di belakang layar.
  sendWhatsAppNotification(booking);

  state.pendingBookings.push(booking);
  await persist();

  clientStep = 'thanks';
  renderClientApp();
}

/* ---------------- Drawer helper (dengan auto-simpan draf) ---------------- */
let formDrafts = {}; // draftKey -> { elementId: value }
let currentDraftKey = null;
let drawerInitialSnapshot = {};
let captureCurrentDraft = null;

function openDrawer(title, bodyHtml, onSave, draftKey){
  let overlay = document.getElementById('drawer-overlay');
  if(overlay) overlay.remove();
  overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'drawer-overlay';
  overlay.innerHTML = `
    <div class="drawer">
      <div class="drawer-head">
        <h3>${title}</h3>
        <div class="close-x" onclick="attemptCloseDrawer()">${ICONS.close}</div>
      </div>
      <div class="drawer-body">${bodyHtml}</div>
      <div class="drawer-foot">
        <button class="btn secondary" onclick="attemptCloseDrawer()">Batal</button>
        <button class="btn" id="drawer-save">Simpan</button>
      </div>
    </div>
  `;
  // sengaja TIDAK menutup saat klik di luar (backdrop) — supaya isian tidak hilang karena kesenggol/salah tap
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>overlay.classList.add('open'));

  currentDraftKey = draftKey || null;
  const fields = Array.from(overlay.querySelectorAll('.drawer-body [id]'));

  // pulihkan draf yang belum sempat disimpan sebelumnya (kalau ada)
  if(currentDraftKey && formDrafts[currentDraftKey]){
    const d = formDrafts[currentDraftKey];
    fields.forEach(el=>{ if(el.id in d) el.value = d[el.id]; });
    if(typeof updateKasPreview==='function' && document.getElementById('f-budget')) updateKasPreview();
    showToast("Melanjutkan draf yang belum disimpan");
  }

  // snapshot nilai awal untuk cek "ada perubahan yang belum disimpan"
  drawerInitialSnapshot = {};
  fields.forEach(el=>{ drawerInitialSnapshot[el.id] = el.value; });

  function captureDraft(){
    if(!currentDraftKey) return;
    const d = {};
    fields.forEach(el=>{ d[el.id] = el.value; });
    formDrafts[currentDraftKey] = d;
  }
  captureCurrentDraft = captureDraft;
  fields.forEach(el=>{
    el.addEventListener('input', captureDraft);
    el.addEventListener('change', captureDraft);
  });

  document.getElementById('drawer-save').onclick = async ()=>{
    const ok = await onSave();
    if(ok!==false){
      if(currentDraftKey) delete formDrafts[currentDraftKey];
      closeDrawerForce();
    }
  };
}
function isDrawerDirty(){
  const overlay = document.getElementById('drawer-overlay');
  if(!overlay) return false;
  const fields = overlay.querySelectorAll('.drawer-body [id]');
  let dirty = false;
  fields.forEach(el=>{ if((drawerInitialSnapshot[el.id]||'') !== el.value) dirty = true; });
  return dirty;
}
function attemptCloseDrawer(){
  if(isDrawerDirty()){
    if(!confirm("Ada isian yang belum disimpan.\n\nTutup jendela ini? Draf yang sudah diisi akan otomatis tersimpan sementara dan bisa dilanjutkan kalau kamu buka formulir ini lagi.")) return;
  }
  closeDrawerForce();
}
function closeDrawerForce(){
  const overlay = document.getElementById('drawer-overlay');
  captureCurrentDraft = null;
  if(!overlay) return;
  overlay.classList.remove('open');
  setTimeout(()=>overlay.remove(), 200);
}
